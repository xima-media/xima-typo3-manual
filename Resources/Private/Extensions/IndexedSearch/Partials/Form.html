<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:form class="manual-search" action="search" controller="Search" extensionName="IndexedSearch" pluginName="ManualResults" method="post" role="search">
    <label class="manual-search_label" for="manual-search-input">
        <f:translate key="LLL:EXT:xima_typo3_manual/Resources/Private/Language/locallang.xlf:search.label"/>
    </label>
    <div class="manual-search_field">
        <f:form.textfield class="manual-search_input" name="search[sword]" value="{sword}" id="manual-search-input"
            placeholder="{f:translate(key: 'LLL:EXT:xima_typo3_manual/Resources/Private/Language/locallang.xlf:search.placeholder')}"/>
    </div>
</f:form>
</html>
