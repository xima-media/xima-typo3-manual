<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:if condition="{pagination}">
    <ul class="tx-indexedsearch-browsebox">
        <f:if condition="{pagination.previousPageNumber}">
            <li class="tx-indexedsearch-browselist-next">
                <a href="#" class="tx-indexedsearch-page-selector" data-prefix="tx_indexedsearch" data-pointer="{pagination.previousPageNumber - 1}" data-free-index-uid="{freeIndexUid}" aria-label="{f:translate(key: 'displayResults.previous')}" title="{f:translate(key: 'displayResults.previous')}">
                    &#8592;
                </a>
            </li>
        </f:if>

        <f:for each="{pagination.allPageNumbers}" as="pageNumber">
            <f:if condition="{pageNumber} == {searchParams.pointer + 1}">
                <f:then>
                    <li><span aria-current="page">{pageNumber}</span></li>
                </f:then>
                <f:else>
                    <li><a href="#" class="tx-indexedsearch-page-selector" data-prefix="tx_indexedsearch" data-pointer="{pageNumber - 1}" data-free-index-uid="{freeIndexUid}">{pageNumber}</a></li>
                </f:else>
            </f:if>
        </f:for>

        <f:if condition="{pagination.nextPageNumber}">
            <li class="tx-indexedsearch-browselist-next">
                <a href="#" class="tx-indexedsearch-page-selector" data-prefix="tx_indexedsearch" data-pointer="{pagination.nextPageNumber - 1}" data-free-index-uid="{freeIndexUid}" aria-label="{f:translate(key: 'displayResults.next')}" title="{f:translate(key: 'displayResults.next')}">
                    &#8594;
                </a>
            </li>
        </f:if>
    </ul>
</f:if>

</html>
