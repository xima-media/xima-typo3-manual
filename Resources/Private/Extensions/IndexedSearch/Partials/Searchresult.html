<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<li>
    <a class="manual-search_hit" href="{row.pathUri}">
        <f:if condition="{row.pathTitle}">
            <f:comment>indexed_search escapes the page titles of the path itself, see settings.breadcrumbWrap</f:comment>
            <span class="manual-search_hit-path">{row.pathTitle -> f:format.raw()}</span>
        </f:if>
        <span class="manual-search_hit-title">{row.item_title}{row.titleaddition}</span>
        <f:if condition="{row.description}">
            <span class="manual-search_hit-snippet">{row.description -> f:format.raw()}</span>
        </f:if>
    </a>
</li>
</html>
