<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="manual-lightbox" id="{id}">
    <a href="#" class="manual-lightbox_close" tabindex="-1" aria-hidden="true"></a>
    <div class="manual-lightbox_content">
        <a href="#" class="manual-lightbox_dismiss" aria-label="{f:translate(key: 'LLL:EXT:xima_typo3_manual/Resources/Private/Language/locallang.xlf:lightbox.close')}"></a>
        <div class="manual-lightbox_body">
            <f:format.raw>{body}</f:format.raw>
        </div>
    </div>
</div>
</html>
