<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default"/>

<f:section name="Main">
    <ol class="manual-steps">
        <f:for each="{slides}" as="slide">
            <li class="manual-steps_item" id="slide-{slide.data.uid}">
                <div class="manual-steps_body">
                    <f:cObject typoscriptObjectPath="lib.singleContent" data="{uid: slide.data.uid, pid: slide.data.pid}"/>
                </div>
            </li>
        </f:for>
    </ol>
</f:section>
</html>
