<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default"/>

<f:section name="Main">
    <f:switch expression="{data.layout}">
        <f:case value="1"><f:variable name="noteVariant" value="info"/></f:case>
        <f:case value="2"><f:variable name="noteVariant" value="success"/></f:case>
        <f:case value="3"><f:variable name="noteVariant" value="warning"/></f:case>
        <f:case value="4"><f:variable name="noteVariant" value="error"/></f:case>
        <f:defaultCase><f:variable name="noteVariant" value="editorial"/></f:defaultCase>
    </f:switch>

    <aside class="manual-note manual-note--{noteVariant}">
        <f:if condition="{data.header}">
            <p class="manual-note_label">{data.header}</p>
        </f:if>
        <f:format.html>{data.bodytext}</f:format.html>
    </aside>
</f:section>
</html>
