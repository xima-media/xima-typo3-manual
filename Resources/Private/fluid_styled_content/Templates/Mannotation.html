<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default"/>

<f:section name="Main">

    <f:if condition="{data.bodytext}">
        <div class="manual-annotation_intro">
            {record -> f:render.text(field: 'bodytext')}
        </div>
    </f:if>

    <f:for each="{images}" as="image" iteration="imageIterator">
        <figure class="manual-annotation">
            <div class="focuspoint">
                <f:image image="{image}" alt="{image.alternative}"/>

                <svg class="focuspoint__svg" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter x="-0.1" y="-0.1" width="1.2" height="1.2" id="solid-{data.uid}">
                            <feFlood flood-color="{color}" result="bg"/>
                            <feMerge>
                                <feMergeNode in="bg"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>

                    <f:for each="{points.{imageIterator.index}}" as="point" iteration="i">
                        <f:if condition="{point.type} == 'marking'">
                            <f:then>
                                <a href="#focuspoint-{data.uid}-{i.cycle}">
                                    <rect x="{point.x}%"
                                        y="{point.y}%"
                                        width="{point.width}%"
                                        height="{point.height}%"
                                        class="focuspoint__svg__rect marking"
                                        stroke="{color}"
                                        stroke-width="2px"
                                        fill="transparent"/>
                                </a>
                                <a href="#focuspoint-{data.uid}-{i.cycle}">
                                    <g transform="{point.markerTransform}">
                                        <circle r="13" cx="{point.markerCx}%" cy="{point.markerCy}%" fill="{color}"/>
                                        <text x="{point.markerCx}%"
                                            y="{point.markerCy}%"
                                            dy="0.35em"
                                            class="focuspoint__svg__marker"
                                            fill="#fff"
                                            text-anchor="middle">{i.cycle}</text>
                                    </g>
                                </a>
                            </f:then>
                            <f:else>
                                <a href="#focuspoint-{data.uid}-{i.cycle}">
                                    <text x="{point.textX}%"
                                        y="{point.textY}%"
                                        class="focuspoint__svg__label"
                                        fill="#fff"
                                        filter="url(#solid-{data.uid})"
                                        alignment-baseline="middle"
                                        text-anchor="middle">{point.title}</text>
                                </a>
                            </f:else>
                        </f:if>
                    </f:for>
                </svg>
            </div>

            <f:variable name="hasDescriptions">0</f:variable>
            <f:for each="{points.{imageIterator.index}}" as="point">
                <f:if condition="{point.title} || {point.description}">
                    <f:variable name="hasDescriptions">1</f:variable>
                </f:if>
            </f:for>

            <f:if condition="{hasDescriptions}">
                <figcaption>
                    <ol class="manual-annotation_points">
                        <f:for each="{points.{imageIterator.index}}" as="point" iteration="i">
                            <f:if condition="{point.title} || {point.description}">
                                <li class="manual-annotation_point" id="focuspoint-{data.uid}-{i.cycle}">
                                    <span class="manual-annotation_marker" aria-hidden="true">{i.cycle}</span>
                                    <div class="manual-annotation_body">
                                        <f:if condition="{point.title}">
                                            <span class="manual-annotation_title">{point.title}</span>
                                        </f:if>
                                        <f:if condition="{point.description}">
                                            <p><f:format.nl2br>{point.description}</f:format.nl2br></p>
                                        </f:if>
                                    </div>
                                </li>
                            </f:if>
                        </f:for>
                    </ol>
                </figcaption>
            </f:if>
        </figure>
    </f:for>

</f:section>
</html>
