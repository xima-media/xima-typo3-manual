# CKEditor5 RTE preset for the editor manual
imports:
    - { resource: "EXT:rte_ckeditor/Configuration/RTE/Processing.yaml" }
    - { resource: "EXT:rte_ckeditor/Configuration/RTE/Editor/Base.yaml" }
    - { resource: "EXT:rte_ckeditor/Configuration/RTE/Editor/Plugins.yaml" }

editor:
  config:
    # EXT:bw_icons/Configuration/RTE/IconPicker.yaml is deliberately not imported: it declares its module as a plain
    # string without its exports. The backend RTE copes with that, the CKEditor bootstrap of EXT:visual_editor
    # iterates the exports of every entry, so the module is declared here in the documented form instead.
    importModules:
      - { module: '@blueways/bw-icons/IconPicker.js', exports: ['default'] }
    contentsCss:
      - "EXT:bw_icons/Resources/Public/Css/Rte.css"
      - "EXT:xima_typo3_manual/Resources/Public/Css/Frontend/rte-content.css"
    table:
      contentToolbar:
        - tableColumn
        - tableRow
        - mergeTableCells
        - tableProperties
        - tableCellProperties
    toolbar:
      items:
        - bold
        - italic
        - underline
        - '|'
        - style
        - '|'
        - bulletedList
        - numberedList
        - '|'
        - insertTable
        - '|'
        - undo
        - redo
        - '|'
        - link
        - removeFormat
        - pasteFromOffice
        - '|'
        - IconPicker
    style:
      definitions:
        - { name: "Grün", element: "span", classes: ['badge', 'badge--green'] }
        - { name: "Blau", element: "span", classes: ['badge', 'badge--blue'] }
        - { name: "Rot", element: "span", classes: ['badge', 'badge--red'] }
