categories:
  manual:
    label: 'XIMA Manual'
  manual.appearance:
    label: Appearance
    parent: manual
  manual.behaviour:
    label: Behaviour
    parent: manual
  manual.navigation:
    label: Navigation
    parent: manual

settings:
  manual.appearance.primaryColor:
    label: 'Primary colour'
    description: 'Lead colour of the manual: links, markers and active states.'
    type: color
    default: '#1A5FB4'
    category: manual.appearance
  manual.appearance.eyebrow:
    label: 'Eyebrow text'
    description: 'Short line above the manual title in the masthead and on the start page. Leave empty to use the translated default "Editor manual".'
    type: string
    default: ''
    category: manual.appearance
  manual.appearance.showNavigation:
    label: 'Show navigation'
    description: 'Whether to display the navigation menu.'
    type: bool
    default: true
    category: manual.appearance
  manual.appearance.showToc:
    label: 'Show table of contents'
    description: 'Whether to display the table of contents.'
    type: bool
    default: true
    category: manual.appearance
  manual.appearance.showContentInNavigation:
    label: 'Show content elements in navigation'
    description: 'List content-element headers in the navigation tree too, not just chapter pages. This is how the navigation worked before it became a chapter-only tree; combine with "Show table of contents" off to get that original look back.'
    type: bool
    default: false
    category: manual.appearance
  manual.behaviour.displayFullManual:
    label: 'Combine chapters on one page'
    description: 'When enabled, every chapter renders on one continuous page, so the manual can be read and searched in one go. When disabled, each chapter gets its own page and its own URL.'
    type: bool
    default: true
    category: manual.behaviour
  manual.navigation.faqPage:
    label: 'FAQ page'
    description: 'Page linked from the "FAQ" entry above the navigation. Leave empty to hide the entry.'
    type: page
    default: 0
    category: manual.navigation
  manual.navigation.changelogPage:
    label: 'Changelog page'
    description: 'Page linked from the "Changelog" entry above the navigation. Leave empty to hide the entry.'
    type: page
    default: 0
    category: manual.navigation
