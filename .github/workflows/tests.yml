name: Tests

on:
  push:
    branches:
      - main
      - 'renovate/**'
  pull_request:
    branches:
      - main

jobs:
  functional:
    name: Functional tests (PHP ${{ matrix.php-version }}, TYPO3 ${{ matrix.typo3-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { typo3-version: "13.4", php-version: "8.2" }
          - { typo3-version: "13.4", php-version: "8.3" }
          - { typo3-version: "13.4", php-version: "8.4" }
          - { typo3-version: "14.3", php-version: "8.3" }
          - { typo3-version: "14.3", php-version: "8.4" }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Configure and start DDEV
        run: |
          ddev config --project-type=typo3 --php-version=${{ matrix.php-version }} --web-environment-add="XDEBUG_MODE=off"
          ddev start

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v2
        with:
          composer-options: --with=typo3/cms-core:"^${{ matrix.typo3-version }}" --with=typo3/cms-rte-ckeditor:"^${{ matrix.typo3-version }}"

      - name: Init TYPO3
        run: ddev init-typo3

      - name: Run functional tests
        run: ddev exec vendor/bin/phpunit -c phpunit.xml.dist
